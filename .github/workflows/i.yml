name: Check Line Endings

on:
  workflow_call:
    inputs:
      ref:
        description: Specifies the commitish to checkout. Defaults to $GITHUB_SHA. For more information, see https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows.
        required: false
        type: string
      default-eol:
        default: lf
        description: Specifies the default line ending. The supported values are "lf"(default), "crlf", and "mixed".
        required: false
        type: string

defaults:
  run:
    shell: bash

jobs:
  check-eol:
    runs-on: ubuntu-22.04
    timeout-minutes: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Check Line Endings
        env:
          DEFAULT_EOL: ${{ inputs.default-eol }}
        run: |
          exit_code=0

          while IFS= read line; do
            if [[ $line =~ ^i/([^ ]*)\ +w/[^\ ]*\ +attr/[^$'\t']+$'\t'(.+)$ ]] ; then
              index_eol=${BASH_REMATCH[1]}
              if [[ $index_eol != $DEFAULT_EOL && $index_eol != 'none' && $index_eol != '-text' && -n $index_eol ]] ; then
                echo "::error file=${BASH_REMATCH[2]}::${BASH_REMATCH[2]}: End-of-line sequence in index ($index_eol) must be $DEFAULT_EOL."
                exit_code=1
              fi
            else
              echo '::error::Unable to match '"$line"
              exit_code=1
            fi
          done < <(git ls-files --with-tree=FETCH_HEAD --eol)

          exit $exit_code
